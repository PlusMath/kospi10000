name: Weekly Analyst Consensus Update

on:
  schedule:
    # 매주 월요일 01:00 UTC = 10:00 KST (기존 로컬 예약작업과 동일한 시각대)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      batch_size:
        description: '이번 실행에서 처리할 종목 수'
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: weekly-consensus
  cancel-in-progress: false

jobs:
  update-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Compute this week's rotation batch
        run: |
          python3 - "${{ github.event.inputs.batch_size || '25' }}" << 'PYEOF'
          import json, re, sys, pathlib

          batch_size = int(sys.argv[1])
          stocks_dir = pathlib.Path('stocks')
          files = sorted(
              p.name for p in stocks_dir.glob('*.html')
              if re.match(r'^\d{3}_[0-9A-Za-z]+\.html$', p.name)
          )
          files = [f for f in files if 'dp-acc"' in (stocks_dir / f).read_text(encoding='utf-8')]
          if not files:
              print('대상 파일 없음'); sys.exit(1)

          state_path = pathlib.Path('consensus_rotation_state.json')
          last_index = 0
          if state_path.exists():
              try:
                  last_index = int(json.loads(state_path.read_text(encoding='utf-8')).get('lastIndex', 0))
              except Exception:
                  last_index = 0
          if last_index >= len(files):
              last_index = 0

          n = min(batch_size, len(files))
          batch = [files[(last_index + i) % len(files)] for i in range(n)]
          next_index = (last_index + len(batch)) % len(files)

          pathlib.Path('_batch_files.txt').write_text(
              '\n'.join(batch), encoding='utf-8'
          )
          print(f'전체 대상: {len(files)}개 / 이번 배치: {len(batch)}개 (커서 {last_index} -> {next_index})')
          for f in batch:
              print(f'  - {f}')
          PYEOF

      - name: Process batch file-by-file (commits each file, waits out session-limit resets)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name "kospi10000-bot"
          git config user.email "actions@users.noreply.github.com"
          NOAUTH=(-c http.https://github.com/.extraheader=)
          JOB_DEADLINE=$(( $(date -u +%s) + 220*60 ))  # timeout-minutes(240)보다 여유있게 220분

          push_current_file() {
            local FILE="$1"
            git add "$FILE"
            if ! git diff --cached --quiet; then
              git commit -m "애널리스트 컨센서스 갱신: $FILE ($(date -u +%Y-%m-%d), GitHub Actions)"
              for i in 1 2 3; do
                git "${NOAUTH[@]}" fetch origin main
                if git rebase origin/main; then
                  if git "${NOAUTH[@]}" push origin HEAD:main; then break; fi
                else
                  echo "::error::리베이스 충돌 ($FILE) — 수동 확인 필요"; git rebase --abort; exit 1
                fi
                sleep 5
              done
            fi
          }

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if [ "$(date -u +%s)" -ge "$JOB_DEADLINE" ]; then
              echo "작업 시간 예산 소진 — 남은 파일은 다음 실행에서 이어감: $FILE"
              break
            fi

            python3 - "stocks/$FILE" << 'PYEOF' > _one_prompt.txt
          import sys, pathlib
          f = sys.argv[1]
          template = pathlib.Path('.github/consensus_prompt_template.md').read_text(encoding='utf-8')
          print(template.replace('%%BATCH_COUNT%%', '1').replace('%%BATCH_LIST%%', f'- {f}'))
          PYEOF

            while true; do
              set +e
              OUT=$(cat _one_prompt.txt | claude -p \
                --permission-mode bypassPermissions \
                --allowedTools "WebSearch,WebFetch,Read,Edit,Grep,Glob,Bash(git diff*),Bash(git status*),Bash(git log*),Bash(grep*),Bash(date*)" \
                --max-budget-usd 3 \
                --output-format text 2>&1)
              set -e
              echo "$OUT"

              if echo "$OUT" | grep -qi "session limit"; then
                RESET_HHMM=$(echo "$OUT" | grep -oiP 'resets \K[0-9]{1,2}:[0-9]{2}[ap]m' | head -1)
                if [ -z "$RESET_HHMM" ]; then
                  echo "한도 메시지는 감지했지만 리셋 시각 파싱 실패 — 이번 실행 종료"; exit 1
                fi
                NOW_EPOCH=$(date -u +%s)
                RESET_EPOCH=$(date -u -d "today ${RESET_HHMM} UTC" +%s)
                if [ "$RESET_EPOCH" -le "$NOW_EPOCH" ]; then
                  RESET_EPOCH=$(date -u -d "tomorrow ${RESET_HHMM} UTC" +%s)
                fi
                WAIT=$(( RESET_EPOCH - NOW_EPOCH + 90 ))
                echo "세션 한도 도달(리셋 ${RESET_HHMM} UTC) — ${WAIT}초 대기 후 같은 파일 재시도"
                if [ $(( $(date -u +%s) + WAIT )) -ge "$JOB_DEADLINE" ]; then
                  echo "대기하면 작업 시간 예산을 넘김 — 이번 실행 종료, 다음 실행에서 이어감"
                  exit 0
                fi
                sleep "$WAIT"
                continue
              fi
              break
            done

            push_current_file "stocks/$FILE"

            # 이 파일까지는 확실히 끝났으니 순환 커서를 여기로 전진(파일 단위로 유실 없이 저장).
            python3 - "$FILE" << 'PYEOF'
          import json, pathlib, datetime, re, sys
          done_file = sys.argv[1]
          stocks_dir = pathlib.Path('stocks')
          files = sorted(
              p.name for p in stocks_dir.glob('*.html')
              if re.match(r'^\d{3}_[0-9A-Za-z]+\.html$', p.name)
          )
          files = [f for f in files if 'dp-acc"' in (stocks_dir / f).read_text(encoding='utf-8')]
          idx = files.index(done_file)
          next_index = (idx + 1) % len(files)
          state = {'lastIndex': next_index, 'lastRunUtc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('consensus_rotation_state.json').write_text(
              json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PYEOF
            push_current_file "consensus_rotation_state.json"
          done < _batch_files.txt

          rm -f _batch_files.txt _one_prompt.txt

      - name: Push to preview repo
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          # actions/checkout이 github.com 전체에 대해 GITHUB_TOKEN(github-actions[bot]) 인증
          # 헤더를 미리 심어놔서, URL에 박은 PREVIEW_REPO_TOKEN보다 그게 우선 적용되며 preview
          # 레포에는 권한이 없어 403이 남 — 이 헤더를 -c로 매 명령마다 비워서 무효화.
          NOAUTH=(-c http.https://github.com/.extraheader=)
          git "${NOAUTH[@]}" remote add preview "https://x-access-token:${PREVIEW_REPO_TOKEN}@github.com/PlusMath/kospi10000_preview.git" 2>/dev/null || \
            git remote set-url preview "https://x-access-token:${PREVIEW_REPO_TOKEN}@github.com/PlusMath/kospi10000_preview.git"
          for i in 1 2 3; do
            git "${NOAUTH[@]}" fetch preview main
            if git rebase preview/main; then
              if git "${NOAUTH[@]}" push preview HEAD:main; then
                break
              fi
            else
              echo "::error::preview 리베이스 충돌 — 수동 확인 필요"
              git rebase --abort
              exit 1
            fi
            echo "preview push 재시도 ($i)"
            sleep 5
          done
